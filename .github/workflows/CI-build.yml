name: Build

run-name: "Workflow CI/CD Step: cargo build"

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    runs-on: warp-ubuntu-latest-x64-8x
    name: Build vflow-node
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: vflow-node build
        uses: ./.github/actions/cmd-in-docker
        with:
          command: "cargo build -p vflow-node --release"
          use_cache: 'yes'
          cache_key: 'build-vflow-node'

      - name: Upload vflow-node build binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: "vflow-node-bin"
          path: |
            target/release/vflow-node
          retention-days: 1
          overwrite: true
